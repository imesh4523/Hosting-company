<div id="account-details-wrapper" style="font-family: 'Poppins', sans-serif, system-ui;">
  <div class="main-header" style="margin-bottom: 30px;">
    <div class="container">
      <h1 class="main-header-title" style="font-size: 32px; font-weight: 800; color: #111; margin-bottom: 5px;">Account Details</h1>
      <div style="font-size: 12px; color: #888;">
        <a href="/dashboard" style="color:#888; text-decoration:none;">Portal Home</a> / 
        <a href="/dashboard" style="color:#888; text-decoration:none;">Client Area</a> / 
        <span style="color:#888;">Account Details</span>
      </div>
    </div>
  </div>

  <div class="main-body">
    <div class="container">
      <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3">
          <h4 style="font-size: 16px; font-weight: 700; color: #000; margin-bottom: 15px; margin-top: 0;">Account</h4>
          <div class="list-group naked-sidebar" style="margin: 0; display: flex; flex-direction: column; gap: 4px;">
            <a href="/dashboard/account/details" class="list-group-item active" style="border:none; background:#f4f7fe; padding:10px 15px; font-size:15px; color:#4a6aff; font-weight:600; border-radius:8px;"><i class="fas fa-user" style="margin-right:12px; width:16px; text-align:center;"></i> Account Details</a>
            <a href="/dashboard/account/users" class="list-group-item" style="border:none; background:transparent; padding:10px 15px; font-size:15px; color:#4a6aff; font-weight:500; border-radius:8px;"><i class="fas fa-arrows-alt-v" style="margin-right:12px; width:16px; text-align:center;"></i> User Management</a>
            <a href="/dashboard/account/paymentmethods" class="list-group-item" style="border:none; background:transparent; padding:10px 15px; font-size:15px; color:#4a6aff; font-weight:500; border-radius:8px;"><i class="fas fa-credit-card" style="margin-right:12px; width:16px; text-align:center;"></i> Payment Methods</a>
            <a href="/dashboard/account/contacts" class="list-group-item" style="border:none; background:transparent; padding:10px 15px; font-size:15px; color:#4a6aff; font-weight:500; border-radius:8px;"><i class="fas fa-user" style="margin-right:12px; width:16px; text-align:center;"></i> Contacts</a>
            <a href="/dashboard/account/security" class="list-group-item" style="border:none; background:transparent; padding:10px 15px; font-size:15px; color:#4a6aff; font-weight:500; border-radius:8px;"><i class="fas fa-shield-alt" style="margin-right:12px; width:16px; text-align:center;"></i> Account Security</a>
            <a href="/dashboard/account/emails" class="list-group-item" style="border:none; background:transparent; padding:10px 15px; font-size:15px; color:#4a6aff; font-weight:500; border-radius:8px;"><i class="fas fa-envelope" style="margin-right:12px; width:16px; text-align:center;"></i> Email History</a>
          </div>
        </div>

        <!-- Form Area -->
        <div class="col-md-9">
          <h2 style="font-size:22px; font-weight:600; color:#111; margin-bottom:25px; margin-top:0;">My Details</h2>
          
          <div style="background: #fff; border-radius: 16px; border: 1px solid #f0f0f0; padding: 30px;">
            <form id="accountDetailsForm">
              
              <div style="display:flex; gap:20px; margin-bottom:25px;">
                <div style="flex:1;">
                  <label style="display:block; font-size:14px; color:#555; margin-bottom:8px;">First Name</label>
                  <input type="text" id="firstName" style="width:100%; border-radius:8px; border:1px solid #e0e0e0; padding:12px 15px; font-size:14px; outline:none;" onfocus="this.style.borderColor='#4a6aff'" onblur="this.style.borderColor='#e0e0e0'">
                </div>
                <div style="flex:1;">
                  <label style="display:block; font-size:14px; color:#555; margin-bottom:8px;">Last Name</label>
                  <input type="text" id="lastName" style="width:100%; border-radius:8px; border:1px solid #e0e0e0; padding:12px 15px; font-size:14px; outline:none;" onfocus="this.style.borderColor='#4a6aff'" onblur="this.style.borderColor='#e0e0e0'">
                </div>
              </div>

              <div style="margin-bottom:25px;">
                <label style="display:block; font-size:14px; color:#555; margin-bottom:8px;">Email Address</label>
                <input type="email" id="email" readonly style="width:100%; border-radius:8px; border:1px solid #f9f9f9; background:#f9f9f9; padding:12px 15px; font-size:14px; outline:none; color:#888;">
              </div>

              <div style="margin-bottom:25px;">
                <label style="display:block; font-size:14px; color:#555; margin-bottom:8px;">Phone Number</label>
                <input type="tel" id="phone" style="width:100%; border-radius:8px; border:1px solid #e0e0e0; padding:12px 15px; font-size:14px; outline:none;" onfocus="this.style.borderColor='#4a6aff'" onblur="this.style.borderColor='#e0e0e0'">
              </div>

              <h3 style="font-size:16px; font-weight:600; color:#111; margin-bottom:15px; margin-top:30px;">Billing Address</h3>
              
              <div style="margin-bottom:25px;">
                <label style="display:block; font-size:14px; color:#555; margin-bottom:8px;">Company Name (Optional)</label>
                <input type="text" id="company" style="width:100%; border-radius:8px; border:1px solid #e0e0e0; padding:12px 15px; font-size:14px; outline:none;" onfocus="this.style.borderColor='#4a6aff'" onblur="this.style.borderColor='#e0e0e0'">
              </div>

              <div style="margin-bottom:25px;">
                <label style="display:block; font-size:14px; color:#555; margin-bottom:8px;">Address 1</label>
                <input type="text" id="address1" style="width:100%; border-radius:8px; border:1px solid #e0e0e0; padding:12px 15px; font-size:14px; outline:none;" onfocus="this.style.borderColor='#4a6aff'" onblur="this.style.borderColor='#e0e0e0'">
              </div>

              <div style="display:flex; gap:20px; margin-bottom:25px;">
                <div style="flex:1;">
                  <label style="display:block; font-size:14px; color:#555; margin-bottom:8px;">City</label>
                  <input type="text" id="city" style="width:100%; border-radius:8px; border:1px solid #e0e0e0; padding:12px 15px; font-size:14px; outline:none;" onfocus="this.style.borderColor='#4a6aff'" onblur="this.style.borderColor='#e0e0e0'">
                </div>
                <div style="flex:1;">
                  <label style="display:block; font-size:14px; color:#555; margin-bottom:8px;">Postcode</label>
                  <input type="text" id="postcode" style="width:100%; border-radius:8px; border:1px solid #e0e0e0; padding:12px 15px; font-size:14px; outline:none;" onfocus="this.style.borderColor='#4a6aff'" onblur="this.style.borderColor='#e0e0e0'">
                </div>
              </div>

              <!-- Footer Actions -->
              <div style="display:flex; gap:15px; margin-top: 30px;">
                <button type="submit" style="background:#4a6aff; color:#fff; border:none; padding:12px 30px; border-radius:8px; font-weight:600; font-size:14px; cursor:pointer;">Save Changes</button>
                <button type="button" onclick="loadAccountDetails()" style="background:#fff; border:1px solid #e0e0e0; padding:12px 30px; border-radius:8px; font-weight:600; font-size:14px; color:#555; cursor:pointer;">Cancel</button>
              </div>
            </form>

            <script>
              async function loadAccountDetails() {
                try {
                  const token = localStorage.getItem('token');
                  const res = await fetch('http://localhost:5000/api/account/details', {
                    headers: { 'Authorization': `Bearer ${token}` }
                  });
                  const json = await res.json();
                  if (json.success) {
                    const d = json.data;
                    const names = (d.name || '').split(' ');
                    document.getElementById('firstName').value = names[0] || '';
                    document.getElementById('lastName').value = names.slice(1).join(' ') || '';
                    document.getElementById('email').value = d.email || '';
                    document.getElementById('phone').value = d.phone || '';
                    document.getElementById('company').value = d.company || '';
                    document.getElementById('address1').value = d.address1 || '';
                    document.getElementById('city').value = d.city || '';
                    document.getElementById('postcode').value = d.postcode || '';
                  }
                } catch (e) {
                  console.error('Failed to load details', e);
                }
              }

              document.getElementById('accountDetailsForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const token = localStorage.getItem('token');
                const data = {
                  name: document.getElementById('firstName').value + ' ' + document.getElementById('lastName').value,
                  phone: document.getElementById('phone').value,
                  company: document.getElementById('company').value,
                  address1: document.getElementById('address1').value,
                  city: document.getElementById('city').value,
                  postcode: document.getElementById('postcode').value
                };

                try {
                  const res = await fetch('http://localhost:5000/api/account/details', {
                    method: 'PUT',
                    headers: { 
                      'Authorization': `Bearer ${token}`,
                      'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                  });
                  const json = await res.json();
                  if (json.success) {
                    alert('Account updated successfully!');
                  } else {
                    alert('Update failed: ' + json.message);
                  }
                } catch (err) {
                  alert('Error saving details');
                }
              });

              // Initial load
              loadAccountDetails();
            </script>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
