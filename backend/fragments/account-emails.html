<div id="account-emails-wrapper" style="font-family: 'Poppins', sans-serif, system-ui;">
  <div class="main-header" style="margin-bottom: 30px;">
    <div class="container">
      <h1 class="main-header-title" style="font-size: 32px; font-weight: 800; color: #111; margin-bottom: 5px;">Email History</h1>
      <div style="font-size: 12px; color: #888;">
        <a href="/dashboard" style="color:#888; text-decoration:none;">Portal Home</a> / 
        <a href="/dashboard" style="color:#888; text-decoration:none;">Client Area</a> / 
        <a href="/dashboard/account/details" style="color:#888; text-decoration:none;">Account Details</a> / 
        <span style="color:#888;">Email History</span>
      </div>
    </div>
  </div>

  <div class="main-body">
    <div class="container">
      <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3">
          <h4 style="font-size: 16px; font-weight: 700; color: #000; margin-bottom: 15px; margin-top: 0;">Account</h4>
          <div class="list-group naked-sidebar" style="margin: 0; display: flex; flex-direction: column; gap: 4px;">
            <a href="/dashboard/account/details" class="list-group-item" style="border:none; background:transparent; padding:10px 15px; font-size:15px; color:#4a6aff; font-weight:500; border-radius:8px;"><i class="fas fa-user" style="margin-right:12px; width:16px; text-align:center;"></i> Account Details</a>
            <a href="/dashboard/account/users" class="list-group-item" style="border:none; background:transparent; padding:10px 15px; font-size:15px; color:#4a6aff; font-weight:500; border-radius:8px;"><i class="fas fa-arrows-alt-v" style="margin-right:12px; width:16px; text-align:center;"></i> User Management</a>
            <a href="/dashboard/account/paymentmethods" class="list-group-item" style="border:none; background:transparent; padding:10px 15px; font-size:15px; color:#4a6aff; font-weight:500; border-radius:8px;"><i class="fas fa-credit-card" style="margin-right:12px; width:16px; text-align:center;"></i> Payment Methods</a>
            <a href="/dashboard/account/contacts" class="list-group-item" style="border:none; background:transparent; padding:10px 15px; font-size:15px; color:#4a6aff; font-weight:500; border-radius:8px;"><i class="fas fa-user" style="margin-right:12px; width:16px; text-align:center;"></i> Contacts</a>
            <a href="/dashboard/account/security" class="list-group-item" style="border:none; background:transparent; padding:10px 15px; font-size:15px; color:#4a6aff; font-weight:500; border-radius:8px;"><i class="fas fa-shield-alt" style="margin-right:12px; width:16px; text-align:center;"></i> Account Security</a>
            <a href="/dashboard/account/emails" class="list-group-item active" style="border:none; background:#f4f7fe; padding:10px 15px; font-size:15px; color:#4a6aff; font-weight:600; border-radius:8px;"><i class="fas fa-envelope" style="margin-right:12px; width:16px; text-align:center;"></i> Email History</a>
          </div>
        </div>

        <!-- Content Area -->
        <!-- Content Area -->
        <div class="col-md-9">
          <div style="background: #fff; border-radius: 16px; border: 1px solid #f0f0f0; overflow:hidden;">
             <table style="width:100%; border-collapse: collapse; text-align:left;">
                <thead>
                   <tr style="background:#fcfcfc; border-bottom:1px solid #f0f0f0;">
                      <th style="padding:15px 20px; font-size:13px; color:#888; font-weight:600;">Date Sent</th>
                      <th style="padding:15px 20px; font-size:13px; color:#888; font-weight:600;">Message Subject</th>
                   </tr>
                </thead>
                <tbody id="email-log-body">
                   <!-- Dynamic emails load here -->
                   <tr>
                     <td colspan="2" style="padding:30px; text-align:center; color:#888;">
                       <i class="fas fa-spinner fa-spin" style="margin-right:8px;"></i> Loading history...
                     </td>
                   </tr>
                </tbody>
             </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');

    async function loadEmails() {
      const tbody = document.getElementById('email-log-body');
      try {
        const res = await fetch('http://localhost:5000/api/account/emails', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const json = await res.json();

        if (json.success && json.data.length > 0) {
          let html = '';
          json.data.forEach(email => {
            const date = new Date(email.sentAt).toLocaleDateString('en-US', {
              year: 'numeric', month: 'short', day: 'numeric'
            });
            html += `
              <tr style="border-bottom:1px solid #f0f0f0;">
                <td style="padding:20px; font-size:14px; color:#555;">${date}</td>
                <td style="padding:20px; font-size:14px; color:#111; font-weight:500;">${email.subject}</td>
              </tr>
            `;
          });
          tbody.innerHTML = html;
        } else {
          tbody.innerHTML = '<tr><td colspan="2" style="padding:40px; text-align:center; color:#888;">No email records found.</td></tr>';
        }
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="2" style="padding:40px; text-align:center; color:red;">Failed to load history.</td></tr>';
      }
    }

    loadEmails();
  </script>
</div>
