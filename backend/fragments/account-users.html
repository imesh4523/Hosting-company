<div id="account-users-wrapper" style="font-family: 'Poppins', sans-serif, system-ui;">
  <div class="main-header" style="margin-bottom: 30px;">
    <div class="container">
      <h1 class="main-header-title" style="font-size: 32px; font-weight: 800; color: #111; margin-bottom: 5px;">User Management</h1>
      <div style="font-size: 12px; color: #888;">
        <a href="/dashboard" style="color:#888; text-decoration:none;">Portal Home</a> / 
        <a href="/dashboard" style="color:#888; text-decoration:none;">Client Area</a> / 
        <a href="/dashboard/account/details" style="color:#888; text-decoration:none;">Account Details</a> / 
        <span style="color:#888;">User Management</span>
      </div>
    </div>
  </div>

  <div class="main-body">
    <div class="container">
      <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3">
          <h4 style="font-size: 16px; font-weight: 700; color: #000; margin-bottom: 15px; margin-top: 0;">Account</h4>
          <div class="list-group naked-sidebar" style="margin: 0; display: flex; flex-direction: column; gap: 4px;">
            <a href="/dashboard/account/details" class="list-group-item" style="border:none; background:transparent; padding:10px 15px; font-size:15px; color:#4a6aff; font-weight:500; border-radius:8px;"><i class="fas fa-user" style="margin-right:12px; width:16px; text-align:center;"></i> Account Details</a>
            <a href="/dashboard/account/users" class="list-group-item active" style="border:none; background:#f4f7fe; padding:10px 15px; font-size:15px; color:#4a6aff; font-weight:600; border-radius:8px;"><i class="fas fa-arrows-alt-v" style="margin-right:12px; width:16px; text-align:center;"></i> User Management</a>
            <a href="/dashboard/account/paymentmethods" class="list-group-item" style="border:none; background:transparent; padding:10px 15px; font-size:15px; color:#4a6aff; font-weight:500; border-radius:8px;"><i class="fas fa-credit-card" style="margin-right:12px; width:16px; text-align:center;"></i> Payment Methods</a>
            <a href="/dashboard/account/contacts" class="list-group-item" style="border:none; background:transparent; padding:10px 15px; font-size:15px; color:#4a6aff; font-weight:500; border-radius:8px;"><i class="fas fa-user" style="margin-right:12px; width:16px; text-align:center;"></i> Contacts</a>
            <a href="/dashboard/account/security" class="list-group-item" style="border:none; background:transparent; padding:10px 15px; font-size:15px; color:#4a6aff; font-weight:500; border-radius:8px;"><i class="fas fa-shield-alt" style="margin-right:12px; width:16px; text-align:center;"></i> Account Security</a>
            <a href="/dashboard/account/emails" class="list-group-item" style="border:none; background:transparent; padding:10px 15px; font-size:15px; color:#4a6aff; font-weight:500; border-radius:8px;"><i class="fas fa-envelope" style="margin-right:12px; width:16px; text-align:center;"></i> Email History</a>
          </div>
        </div>

        <!-- Content Area -->
        <!-- Content Area -->
        <div class="col-md-9" id="user-list-container">
          <!-- Loading State -->
          <div style="background: #fff; border-radius: 16px; border: 1px solid #f0f0f0; padding: 100px 40px; text-align: center;">
             <i class="fas fa-spinner fa-spin" style="font-size:30px; color:#4a6aff; margin-bottom:15px;"></i>
             <p>Loading users...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');

    async function loadUsers() {
      const container = document.getElementById('user-list-container');
      try {
        const res = await fetch('http://localhost:5000/api/account/users', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const json = await res.json();

        if (json.success && json.data.length > 0) {
          let html = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
              <h2 style="font-size:22px; font-weight:600; color:#111; margin:0;">Users</h2>
              <button onclick="inviteUserPrompt()" style="background:#4a6aff; color:#fff; border:none; padding:8px 20px; border-radius:24px; font-weight:600; font-size:13px; cursor:pointer;">Invite New User</button>
            </div>
            <div style="background: #fff; border-radius: 16px; border: 1px solid #f0f0f0; overflow:hidden;">
              <table style="width:100%; border-collapse:collapse;">
                <thead>
                  <tr style="background:#f9f9f9; text-align:left;">
                    <th style="padding:15px; font-size:13px; color:#666; font-weight:600;">Name</th>
                    <th style="padding:15px; font-size:13px; color:#666; font-weight:600;">Email</th>
                    <th style="padding:15px; font-size:13px; color:#666; font-weight:600;">Status</th>
                    <th style="padding:15px; font-size:13px; color:#666; font-weight:600; text-align:right;">Actions</th>
                  </tr>
                </thead>
                <tbody>
          `;
          json.data.forEach(user => {
            html += `
              <tr style="border-bottom:1px solid #f0f0f0;">
                <td style="padding:15px; font-size:14px; color:#111; font-weight:500;">${user.name}</td>
                <td style="padding:15px; font-size:14px; color:#555;">${user.email}</td>
                <td style="padding:15px;"><span style="background:${user.status === 'active' ? '#e6ffec' : '#fff1f0'}; color:${user.status === 'active' ? '#52c41a' : '#f5222d'}; padding:4px 10px; border-radius:4px; font-size:12px; font-weight:600;">${user.status.toUpperCase()}</span></td>
                <td style="padding:15px; text-align:right;"><button onclick="removeUser('${user.id}')" style="background:transparent; border:none; color:#ff4d4f; cursor:pointer; font-size:13px; font-weight:600;">Remove</button></td>
              </tr>
            `;
          });
          html += '</tbody></table></div>';
          container.innerHTML = html;
        } else {
          container.innerHTML = `
            <div style="background: #fff; border-radius: 16px; border: 1px solid #f0f0f0; padding: 100px 40px; text-align: center;">
              <div style="position:relative; width:80px; height:80px; margin:0 auto 20px;">
                <div style="position:absolute; top:10px; right:10px; width:45px; height:45px; background:#4a6aff; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff;">
                   <i class="fas fa-user-plus" style="font-size: 20px;"></i>
                </div>
              </div>
              <h2 style="font-size:20px; font-weight:600; color:#111; margin-bottom:15px;">No additional users found</h2>
              <p style="color:#666; font-size:14px; margin-bottom:30px;">Invite team members to help manage your account and services.</p>
              <button onclick="inviteUserPrompt()" style="background:#4a6aff; color:#fff; border:none; padding:10px 24px; border-radius:24px; font-weight:600; font-size:14px; cursor:pointer;">Invite New User</button>
            </div>
          `;
        }
      } catch (e) {
        container.innerHTML = '<p style="color:red; text-align:center;">Failed to load users.</p>';
      }
    }

    async function inviteUserPrompt() {
      const email = prompt('Enter email address of the user to invite:');
      if (!email) return;
      const name = prompt('Enter their name:');
      if (!name) return;

      try {
        const res = await fetch('http://localhost:5000/api/account/users/invite', {
          method: 'POST',
          headers: { 
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, name })
        });
        const json = await res.json();
        if (json.success) {
          alert('Invitation sent successfully!');
          loadUsers();
        } else {
          alert('Failed to invite: ' + json.message);
        }
      } catch (err) {
        alert('Error inviting user');
      }
    }

    async function removeUser(id) {
      if (!confirm('Are you sure you want to remove this user?')) return;
      try {
        await fetch(\`http://localhost:5000/api/account/users/\${id}\`, {
          method: 'DELETE',
          headers: { 'Authorization': \`Bearer \${token}\` }
        });
        loadUsers();
      } catch (e) {
        alert('Error removing user');
      }
    }

    loadUsers();
  </script>
</div>
