<div class="main-content">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="section-header">
                    <h2 class="section-title">My Domains</h2>
                    <div class="section-actions">
                        <a href="/dashboard/domains/new" class="btn btn-primary">
                            <i class="ls ls-dns"></i> Register New Domain
                        </a>
                    </div>
                </div>
                
                <div class="panel panel-default">
                    <div class="panel-body">
                        <div class="table-responsive">
                            <table class="table table-list">
                                <thead>
                                    <tr>
                                        <th>Domain Name</th>
                                        <th>Registration Date</th>
                                        <th>Expiry Date</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="domainsList">
                                    <tr>
                                        <td colspan="5" class="text-center">Loading domains...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    (function() {
        async function loadDomains() {
            try {
                const response = await fetch('/api/domains');
                const result = await response.json();
                const tbody = document.getElementById('domainsList');
                
                if (result.success && result.data.length > 0) {
                    tbody.innerHTML = result.data.map(domain => `
                        <tr>
                            <td><strong>${domain.domainName}</strong></td>
                            <td>${new Date(domain.registrationDate).toLocaleDateString()}</td>
                            <td>${new Date(domain.expiryDate).toLocaleDateString()}</td>
                            <td><span class="label label-${domain.status === 'active' ? 'success' : 'default'}">${domain.status.toUpperCase()}</span></td>
                            <td>
                                <button class="btn btn-default btn-sm">Manage</button>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center">No domains found.</td></tr>';
                }
            } catch (error) {
                console.error("Failed to load domains:", error);
            }
        }
        loadDomains();
    })();
</script>
