<div class="main-content">
    <div class="container">
        <div class="row">
            <div class="col-md-8 col-md-offset-2">
                <div class="section-header">
                    <h2 class="section-title">Open New Ticket</h2>
                </div>
                
                <div class="panel panel-default">
                    <div class="panel-body">
                        <form id="newTicketForm">
                            <div class="form-group">
                                <label for="subject">Subject</label>
                                <input type="text" id="subject" class="form-control" required placeholder="What is this regarding?">
                            </div>
                            <div class="form-group">
                                <label for="priority">Priority</label>
                                <select id="priority" class="form-control">
                                    <option value="low">Low</option>
                                    <option value="medium" selected>Medium</option>
                                    <option value="high">High</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="message">Message</label>
                                <textarea id="message" class="form-control" rows="8" required placeholder="Describe your issue in detail..."></textarea>
                            </div>
                            <div class="form-actions text-right">
                                <a href="/dashboard/tickets" class="btn btn-default">Cancel</a>
                                <button type="submit" class="btn btn-primary">Submit Ticket</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    (function() {
        document.getElementById('newTicketForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            
            const data = {
                subject: document.getElementById('subject').value,
                priority: document.getElementById('priority').value,
                message: document.getElementById('message').value
            };
            
            try {
                const response = await fetch('/api/tickets', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                if (result.success) {
                    alert('Ticket created successfully!');
                    window.location.href = '/dashboard/tickets/' + result.data.id;
                } else {
                    alert('Error: ' + result.message);
                    submitBtn.disabled = false;
                }
            } catch (error) {
                alert('Connection error');
                submitBtn.disabled = false;
            }
        });
    })();
</script>
