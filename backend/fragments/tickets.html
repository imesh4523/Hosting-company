<div class="main-content">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="section-header">
                    <h2 class="section-title">Support Tickets</h2>
                    <div class="section-actions">
                        <a href="/dashboard/tickets/new" class="btn btn-primary">
                            <i class="ls ls-new-window"></i> Open New Ticket
                        </a>
                    </div>
                </div>
                
                <div class="panel panel-default">
                    <div class="panel-body">
                        <div class="table-responsive">
                            <table class="table table-list">
                                <thead>
                                    <tr>
                                        <th>Subject</th>
                                        <th>Status</th>
                                        <th>Last Updated</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="ticketsList">
                                    <tr>
                                        <td colspan="4" class="text-center">Loading tickets...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    (function() {
        async function loadTickets() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('/api/tickets', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await response.json();
                const tbody = document.getElementById('ticketsList');
                
                if (result.success && result.data.length > 0) {
                    tbody.innerHTML = result.data.map(ticket => `
                        <tr>
                            <td><strong>${ticket.subject}</strong></td>
                            <td><span class="label label-${ticket.status === 'open' ? 'success' : 'default'}">${ticket.status.toUpperCase()}</span></td>
                            <td>${new Date(ticket.updatedAt).toLocaleString()}</td>
                            <td>
                                <a href="/dashboard/tickets/${ticket.id}" class="btn btn-default btn-sm">View</a>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center">No tickets found.</td></tr>';
                }
            } catch (error) {
                console.error("Failed to load tickets:", error);
            }
        }
        loadTickets();
    })();
</script>
