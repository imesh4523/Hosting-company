events { worker_connections 1024; }

http {
  # ─── Rate limiting zones ────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=100r/m;

  # ─── Upstream services ──────────────────────────────────────────────────────
  upstream frontend { server frontend:3000; }
  upstream admin    { server admin:3001;    }
  upstream backend  { server backend:4000;  }

  # ─── HTTP → HTTPS redirect ──────────────────────────────────────────────────
  server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com admin.yourdomain.com api.yourdomain.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  # ─── Customer Frontend ───────────────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    ssl_certificate     /etc/nginx/certs/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
      proxy_pass         http://frontend;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }

  # ─── Admin Dashboard ─────────────────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name admin.yourdomain.com;

    ssl_certificate     /etc/nginx/certs/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Restrict to admin IPs only (optional)
    # allow 1.2.3.4;
    # deny  all;

    location / {
      proxy_pass         http://admin;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }

  # ─── Backend API + WebSocket (Terminal) ─────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;

    ssl_certificate     /etc/nginx/certs/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Auth rate limiting
    location /api/auth/ {
      limit_req zone=auth_limit burst=5 nodelay;
      proxy_pass         http://backend;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Regular API
    location /api/ {
      limit_req zone=api_limit burst=20 nodelay;
      proxy_pass         http://backend;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket terminal proxy
    location /terminal/ {
      proxy_pass          http://backend;
      proxy_http_version  1.1;
      proxy_set_header    Upgrade    $http_upgrade;
      proxy_set_header    Connection "upgrade";
      proxy_set_header    Host       $host;
      proxy_set_header    X-Real-IP  $remote_addr;
      proxy_read_timeout  1800s;  # 30 min idle timeout
      proxy_send_timeout  1800s;
    }

    # Stripe webhook — no rate limit
    location /api/billing/webhook {
      proxy_pass         http://backend;
      proxy_http_version 1.1;
      proxy_set_header   X-Real-IP $remote_addr;
    }
  }
}
